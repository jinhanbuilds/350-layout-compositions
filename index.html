<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="自由浏览 350 种构图、排版与界面布局的桌面端瀑布流图鉴。"
    />
    <title>350 种排版 · 流动图鉴</title>
    <link rel="stylesheet" href="web/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#gallery">跳到图鉴</a>

    <header class="topbar">
      <div class="topbar__primary">
        <a class="brand" href="#top" aria-label="回到图鉴顶部">
          <span class="brand__mark" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span>
            <strong>350 种排版</strong>
            <small>Layout Atlas</small>
          </span>
        </a>

        <div class="toolbar">
          <label class="search" for="searchInput">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.75"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
            <input
              id="searchInput"
              type="search"
              autocomplete="off"
              placeholder="搜索名称、分类或编号"
            />
            <kbd>/</kbd>
          </label>
          <p id="resultCount" class="result-count" aria-live="polite"></p>
        </div>
      </div>

      <nav id="categoryFilters" class="filters" aria-label="按分类筛选"></nav>
    </header>

    <main id="top" class="page-shell">
      <section class="intro" aria-labelledby="pageTitle">
        <p class="intro__eyebrow">Visual composition archive</p>
        <h1 id="pageTitle">顺着画面，<br />找到下一种可能。</h1>
        <p class="intro__copy">
          悬停查看线索，点击让卡片从原位展开。按 <kbd>Esc</kbd> 随时回到瀑布流。
        </p>
      </section>

      <section id="gallery" class="gallery" aria-label="排版卡片瀑布流"></section>

      <div id="emptyState" class="empty-state" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7.5h16M7 4v7m10-7v7M5.5 14.5h13M8 18h8"></path>
        </svg>
        <h2>没有找到对应卡片</h2>
        <p>换一个关键词，或回到全部分类继续浏览。</p>
        <button id="resetButton" type="button">查看全部</button>
      </div>
    </main>

    <dialog id="detailDialog" class="detail-dialog" aria-labelledby="detailTitle">
      <article class="detail-card">
        <div class="detail-visual">
          <img id="detailImage" alt="" width="1086" height="1448" />
          <div class="detail-loader" aria-hidden="true"><span></span></div>
          <p id="imageStatus" class="image-status" aria-live="polite">正在载入高清图</p>
        </div>

        <div class="detail-content">
          <button id="closeButton" class="icon-button close-button" type="button" aria-label="关闭详情">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18"></path>
            </svg>
          </button>

          <div class="detail-copy">
            <p id="detailEyebrow" class="detail-eyebrow"></p>
            <h2 id="detailTitle"></h2>
            <p id="detailDescription" class="detail-description"></p>
            <section class="detail-prompt" aria-labelledby="promptLabel">
              <p id="promptLabel" class="detail-prompt__label">图片提示词</p>
              <p id="detailPrompt" class="detail-prompt__text"></p>
            </section>
            <div id="detailTags" class="detail-tags"></div>
          </div>

          <div class="detail-actions">
            <button id="copyButton" class="copy-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="8" y="8" width="11" height="11" rx="2"></rect>
                <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
              </svg>
              <span>复制提示词</span>
            </button>
            <p>复制上方完整提示词，可直接用于设计说明或继续改写。</p>
          </div>
        </div>
      </article>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="web/catalog-data.js"></script>
    <script src="web/card-content.js"></script>
    <script src="web/app.js"></script>
  </body>
</html>
